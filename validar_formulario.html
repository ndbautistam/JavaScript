<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>validar formulario</title>
</head>
<body>
    <h1>Validar contraseña de un formulario</h1>
    <form onsubmit="return validarContrasena()">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>
        <br>
        <label for="correo">Correo:</label>
        <input type="email" id="correo" required>
        <br>
        <label for="contra1">contraseña:</label>
        <input type="password" id="contra1" required>
        <br>
        <label for="contra2">Confirmar contraseña:</label>
        <input type="password" id="contra2" required>
        <br>
        <input type="submit" value="Enviar" required>
    </form>
    
    <script src="validar_formulario.js"></script>
</body>
</html>
