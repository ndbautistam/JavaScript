
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de aprendices</title>
    <link rel="stylesheet" href="Actividad_10.css">
</head>
<body>

    <h1>Registro de aprendices de la ficha</h1>

    <form id="formulario">

        <input type="text" id="nombre"
            placeholder="Nombre completo">

        <input type="email" id="correo"
            placeholder="Correo">

        <input type="number" id="nota"
            placeholder="Nota (0.0 a 5.0)"
            step="0.1">

        <button type="submit">Registrar</button>

    </form>

    <p id="error"></p>

    <table border="1">

        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Nota</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody id="tabla"></tbody>

    </table>

    <p id="resumen">
        Total: 0 | Promedio: 0 | Aprobados: 0
    </p>

    <script src="Actividad_10.js"></script>

</body>
</html>
